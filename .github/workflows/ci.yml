# Pull request validation (and a quick check on feature-branch pushes).
#
#   pull_request (any base, incl. dev and main):
#     format check of the files the PR changes (blocking), flutter analyze,
#     flutter test, then an unsigned release build of the dev flavor to prove
#     the Android build still works. Nothing is uploaded or published, and no
#     secrets are used, so PRs from forks are safe to run.
#   push to any branch except dev/main (those have their own build workflows):
#     analyze + test (+ whole-repo format report); no APK build.
#
# Docs: docs/CI-CD.md
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - dev
      - main

# Only the newest commit of a PR / branch matters.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Two callers with different names on purpose: branch protection requires
# "Android / Validate" and "Android / Build APK", and only PR runs may produce
# those names. (A push run's skipped build job would otherwise post a
# same-named "skipped" check on the PR's commit, which GitHub counts as
# passing.)
jobs:
  android:
    name: Android
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/android-build.yml
    with:
      channel: ci
      # Blocking format check of the PR's changed files — except the dev →
      # main promotion PR: everything on dev already passed this gate on its
      # way in, so re-checking would only re-flag pre-gate debt (report only).
      # (Inverted on purpose: `cond && '' || sha` would always give sha.)
      format-base: ${{ (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository) && github.event.pull_request.base.sha || '' }}
      build: true
      signing: none

  branch:
    name: Branch check
    if: github.event_name == 'push'
    uses: ./.github/workflows/android-build.yml
    with:
      channel: ci
      build: false
