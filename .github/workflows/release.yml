# Production release — triggered only by pushing a vMAJOR.MINOR.PATCH tag.
#
#   check-tag  tag format, tag == pubspec version, commit is on main,
#              version and build number above the previous release
#   build      validate (format report, analyze, test) → signed prod APK + AAB
#   publish    release notes from commits since the previous tag → GitHub
#              Release with mulearn-X.Y.Z.apk, mulearn-X.Y.Z.aab, SHA256SUMS.txt
#
# How to cut a release: docs/CI-CD.md "Creating a release".
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag
        run: bash .github/scripts/check_release_tag.sh "$GITHUB_REF_NAME"

  build:
    name: Android
    needs: check-tag
    uses: ./.github/workflows/android-build.yml
    with:
      channel: release
      signing: required
      environment: Production
      appbundle: true
      upload: true
      retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download APK and AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.build.outputs.artifact }}.*
          path: downloaded
          merge-multiple: true

      - name: Collect assets
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.apk' -o -name '*.aab' \) -exec mv -t release {} +
          for f in "${ARTIFACT}.apk" "${ARTIFACT}.aab"; do
            [ -f "release/$f" ] || { echo "::error::release/$f is missing."; exit 1; }
          done
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Write release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
          SHA: ${{ needs.build.outputs.sha }}
          BUILT_AT: ${{ needs.build.outputs.built-at }}
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Build number (versionCode) | \`${BUILD_NUMBER}\` |"
            echo "| Application ID | \`org.mulearn.muapp\` |"
            echo "| Commit | ${SHA} |"
            echo "| Built (UTC) | ${BUILT_AT} |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo
            echo "Install \`mulearn-${VERSION}.apk\` on Android; \`.aab\` is the Play Store upload. Checksums are in \`SHA256SUMS.txt\`."
            echo
            bash .github/scripts/release_notes.sh "$GITHUB_REF_NAME"
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "μLearn ${VERSION}" \
            --notes-file notes.md \
            release/*
