# Stable channel — every push/merge to master builds a production-signed APK of
# the prod flavor (Mulearn, org.mulearn.app, prod API host) and uploads it
# as a workflow artifact. It does NOT create a GitHub Release: releases come
# only from vX.Y.Z tags (release.yml).
#
# The build job uses the Production environment, which holds the signing key,
# admits only master and v* tags, and may require an approval.
# Docs: docs/CI-CD.md
name: Stable build

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Every merge to master is a release candidate: queue, don't cancel.
concurrency:
  group: stable-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Android
    uses: ./.github/workflows/android-build.yml
    # Required for the called workflow to read the Production/Development
    # environment secrets, even though its build job names the environment.
    secrets: inherit
    with:
      channel: stable
      signing: required
      environment: Production
      upload: true
      retention-days: 30
