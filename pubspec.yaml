name: mulearn_app
description: "μLearn — Flutter app (auth + profile)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management (code-gen Riverpod) — rules.md §1
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Routing
  go_router: ^18.1.4

  # Networking + HTTP response cache
  dio: ^5.7.0
  dio_cache_interceptor: ^4.0.7
  http_cache_hive_store: ^5.1.1
  hive_ce: ^2.23.3
  # Opened directly by core/storage/cache_store_factory.dart to prove the
  # cache box is usable before trusting it (already in the lock file).
  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Env config (build-time, type-safe) — never flutter_dotenv (rules.md §1)
  envied: ^1.1.1

  # Secure storage — tokens only (rules.md §1)
  flutter_secure_storage: ^11.2.0

  # Images
  cached_network_image: ^4.0.7
  image: ^4.5.0
  image_picker: ^1.1.2
  # Cache directory for the persistent HTTP cache (already in the lock file
  # transitively; now used directly by core/storage/cache_store_factory.dart).
  path_provider: ^2.1.6

  # Fonts
  google_fonts: ^9.0.0

  # Logging (no print() in committed code — rules.md §7)
  logger: ^2.5.0

  # Native social sign-in — token exchange with /auth/google-mobile/ and
  # /auth/apple-mobile/. Not in rules.md §1's original stack list; added with
  # explicit approval once those endpoints were confirmed real (a native
  # token exchange, not the web-redirect flow originally assumed).
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Opens an event's external registration URL in the device browser.
  url_launcher: ^6.3.1
  lucide_icons: ^0.257.0
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.4.0
  package_info_plus: ^10.2.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: 22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.2
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  envied_generator: ^1.1.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  # Lint rules (analysis_options.yaml includes them); riverpod_lint is
  # installed as an analyzer plugin there, not here.
  very_good_analysis: ^7.0.0

# `dart run flutter_launcher_icons` regenerates the iOS/Android icon sets.
# Every image is rendered by design/logo/build_logo.py (never edit them by hand):
# - app_icon.png: full-bleed square, no alpha (iOS masks the corners itself);
# - app_icon_android.png: the rounded tile, for pre-Oreo launchers;
# - background/foreground/monochrome: Android adaptive layers on the full
#   108dp canvas (the tile is the 72dp viewport), hence a 0% inset.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  image_path_android: assets/icon/app_icon_android.png
  ios: true
  android: true
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  remove_alpha_ios: true

# Upstream lucide_icons 0.257.0 subclasses Flutter's IconData, which this
# SDK marks a final class — the published package fails to compile as-is.
# See third_party/lucide_icons for the patched fork (same public API).
dependency_overrides:
  lucide_icons:
    path: third_party/lucide_icons

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # The μLearn mark (cut from the dashboard favicon) and the dashboard's
    # wordmarks (public/logo.webp, public/logo-dark.webp).
    - assets/images/
    # The dashboard's StateDisplay illustrations (mulearn-dashboard
    # public/images/illustrations/), copied unchanged.
    - assets/illustrations/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
